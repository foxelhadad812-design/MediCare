<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066F5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066F5"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="600" height="400" rx="24" fill="url(#heroBg)"/>

  <!-- Hospital Cross Grid Decoration -->
  <g opacity="0.15" stroke="#0066F5" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="50" y1="40" x2="550" y2="40"/>
    <line x1="50" y1="140" x2="550" y2="140"/>
    <line x1="50" y1="240" x2="550" y2="240"/>
    <line x1="50" y1="340" x2="550" y2="340"/>
  </g>

  <!-- Main Digital Health Dashboard Mockup Card -->
  <g filter="url(#cardShadow)">
    <rect x="80" y="50" width="440" height="300" rx="16" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Dashboard Top Bar -->
  <rect x="80" y="50" width="440" height="48" rx="16" fill="#F8FAFC"/>
  <circle cx="108" cy="74" r="6" fill="#EF4444"/>
  <circle cx="126" cy="74" r="6" fill="#F59E0B"/>
  <circle cx="144" cy="74" r="6" fill="#10B981"/>
  <rect x="220" y="65" width="160" height="18" rx="9" fill="#E2E8F0"/>

  <!-- Heart Pulse ECG Line Vector -->
  <path d="M 100 160 L 150 160 L 165 130 L 180 195 L 195 145 L 210 170 L 225 160 L 320 160" 
        fill="none" stroke="#0066F5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Telehealth / Live Badge -->
  <g transform="translate(340, 115)">
    <rect width="160" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <circle cx="28" cy="28" r="14" fill="#ECFDF5"/>
    <circle cx="28" cy="28" r="6" fill="#10B981"/>
    <text x="50" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">SignalR Connected</text>
    <text x="50" y="40" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Instant Slot Broadcast</text>
  </g>

  <!-- Doctor Badge Floating Chip -->
  <g transform="translate(100, 215)">
    <rect width="180" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <circle cx="32" cy="32" r="18" fill="url(#primaryGrad)"/>
    <!-- Doctor Icon -->
    <path d="M 28 30 C 28 26, 36 26, 36 30 C 36 34, 28 34, 28 30 Z M 24 40 C 24 35, 40 35, 40 40" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="60" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Dr. Ahmed Mahmoud</text>
    <text x="60" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#0066F5">Cardiology Specialist</text>
  </g>

  <!-- Verified Booking Protection Chip -->
  <g transform="translate(300, 215)">
    <rect width="200" height="64" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#cardShadow)"/>
    <circle cx="32" cy="32" r="18" fill="url(#greenGrad)"/>
    <!-- Checkmark Icon -->
    <path d="M 25 32 L 29 36 L 39 26" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="60" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">ACID Concurrency</text>
    <text x="60" y="44" font-family="system-ui, sans-serif" font-size="10" fill="#10B981">0 Double-Booking Guarantee</text>
  </g>

  <!-- Floating Metric Stat Pill -->
  <g transform="translate(200, 310)">
    <rect width="200" height="36" rx="18" fill="#0F172A" filter="url(#cardShadow)"/>
    <circle cx="20" cy="18" r="5" fill="#10B981"/>
    <text x="35" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Egypt Clinic Network &bull; 100% Live</text>
  </g>
</svg>
