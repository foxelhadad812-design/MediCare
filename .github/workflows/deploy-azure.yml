name: Deploy to Azure App Service

# Deployment is intentionally manual. Running CI on main must never deploy automatically.
# Deploy only when explicitly started after Azure settings and secrets are ready.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-24.04

    steps:
      - name: Validate Azure deployment settings
        env:
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          test -n "$AZURE_WEBAPP_NAME" || { echo "::error::Set the AZURE_WEBAPP_NAME repository variable."; exit 1; }
          test -n "$AZURE_WEBAPP_PUBLISH_PROFILE" || { echo "::error::Add the Azure App Service publish profile as AZURE_WEBAPP_PUBLISH_PROFILE."; exit 1; }

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore MediCare.sln

      - name: Build Solution
        run: dotnet build MediCare.sln --configuration Release --no-restore

      - name: Publish Web Application
        run: dotnet publish src/MediCare.Web/MediCare.Web.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/publish
